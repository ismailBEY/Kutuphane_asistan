swagger: "2.0"
info:
  title: Library Assistant API
  description: API for managing library books, favorites, and AI-powered search.
  version: 1.0.0
securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "Enter your token with the prefix: Bearer <token>"
security:
  - BearerAuth: []
paths:
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - username
              - password
            properties:
              username:
                type: string
              password:
                type: string
      responses:
        '201':
          description: User created successfully
        '400':
          description: Username already exists or missing data
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login and get JWT token
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - username
              - password
            properties:
              username:
                type: string
              password:
                type: string
      responses:
        '200':
          description: Successful login
          schema:
            type: object
            properties:
              access_token:
                type: string
        '401':
          description: Bad username or password
  /api/search:
    get:
      tags:
        - Books
      summary: Search for a book (Public & AI Powered)
      parameters:
        - in: query
          name: title
          type: string
          required: true
          description: Title of the book to search
      responses:
        '200':
          description: Book found
          schema:
            type: object
            properties:
              title:
                type: string
              author:
                type: string
              year:
                type: string
              context:
                type: string
                description: AI generated summary
        '404':
          description: Book not found
  /api/favorite:
    post:
      tags:
        - Favorites
      summary: Add a book to favorites (Protected)
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              title:
                type: string
              author:
                type: string
              year:
                type: string
      responses:
        '201':
          description: Book added to favorites
  /api/favorites:
    get:
      tags:
        - Favorites
      summary: List my favorite books (Protected)
      responses:
        '200':
          description: List of favorite books
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: integer
                title:
                  type: string
                author:
                  type: string
                year:
                  type: string
