<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kütüphane Asistanı</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 1.5rem; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: left; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loading { color: #666; font-style: italic; display: none; margin-top: 10px;}
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Kütüphane Asistanı</h1>
    <p>Aramak istediğiniz kitabın adını girin:</p>
    
    <input type="text" id="bookName" placeholder="Örn: Nutuk, 1984, Sefiller...">
    <button onclick="searchBook()">Ara</button>
    
    <div id="loading" class="loading">Aranıyor...</div>
    <div id="result"></div>
</div>

<script>
    async function searchBook() {
        const title = document.getElementById('bookName').value;
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');

        if (!title) {
            alert("Lütfen bir kitap adı girin!");
            return;
        }

        // Ekranı temizle
        resultDiv.style.display = 'none';
        resultDiv.className = '';
        loadingDiv.style.display = 'block';

        try {
            // Bizim Flask API'ye istek atıyoruz
            const response = await fetch(`/api/search?title=${title}`);
            const data = await response.json();

            loadingDiv.style.display = 'none';
            resultDiv.style.display = 'block';

            if (response.ok) {
                resultDiv.className = 'success';
                resultDiv.innerHTML = `
                    <strong>📘 Kitap Bulundu!</strong><br>
                    <b>Adı:</b> ${data.title}<br>
                    <b>Yazar:</b> ${data.author}<br>
                    <b>Yıl:</b> ${data.year}
                `;
            } else {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `⚠️ ${data.error || data.message}`;
            }
        } catch (error) {
            loadingDiv.style.display = 'none';
            resultDiv.style.display = 'block';
            resultDiv.className = 'error';
            resultDiv.innerHTML = "Sunucu ile iletişim hatası!";
        }
    }
</script>

</body>
</html>
